<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Guy the Folk Valley</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0f1c;
      color: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    #game canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      image-rendering: pixelated;
    }

    .hud-el {
      display: none;
    }

    body.playing .hud-el {
      display: block;
    }

    #hud {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      left: calc(env(safe-area-inset-left, 0px) + 10px);
      font-size: 12px;
      line-height: 1.55;
      background: rgba(0, 0, 0, .5);
      padding: 8px 12px;
      border-radius: 8px;
      pointer-events: none;
      text-shadow: 0 1px 0 rgba(0, 0, 0, .7);
      letter-spacing: .5px;
      border: 1px solid rgba(255, 255, 255, .1);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    #hud .k {
      color: #8fb8ff;
    }

    #hud .v {
      color: #ffe07a;
    }

    #hud .mode {
      color: #7cffa0;
    }

    #inv {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      line-height: 1.6;
      background: rgba(0, 0, 0, .5);
      padding: 8px 16px;
      border-radius: 10px;
      pointer-events: none;
      text-shadow: 0 1px 0 rgba(0, 0, 0, .7);
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, .1);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
    }

    body.playing #inv {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .inv-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .inv-icon {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      display: inline-block;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .5);
    }

    .inv-icon.coin {
      background: #ffd94a;
    }

    .inv-icon.potion {
      background: #e04a4a;
    }

    .inv-icon.gem {
      background: #3fd0ee;
    }

    .inv-icon.chest {
      background: #8a5a28;
    }

    .inv-item span.v {
      color: #ffe07a;
      font-weight: bold;
    }

    #minimap {
      position: fixed;
      right: calc(env(safe-area-inset-right, 0px) + 10px);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
      width: 130px;
      height: 130px;
      border: 2px solid rgba(255, 255, 255, .35);
      border-radius: 10px;
      background: rgba(0, 0, 0, .6);
      image-rendering: pixelated;
      pointer-events: none;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .5);
    }

    #stick {
      position: fixed;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .35);
      background: rgba(255, 255, 255, .08);
      display: none;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 5;
    }

    #knob {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .45);
      border: 2px solid rgba(255, 255, 255, .65);
      transform: translate(-50%, -50%);
      left: 60px;
      top: 60px;
    }

    #hint {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
      transform: translateX(-50%);
      font-size: 11px;
      opacity: .8;
      pointer-events: none;
      background: rgba(0, 0, 0, .5);
      padding: 7px 14px;
      border-radius: 8px;
      letter-spacing: 1px;
      transition: opacity .8s;
      z-index: 5;
      border: 1px solid rgba(255, 255, 255, .1);
    }

    #actionRow {
      position: fixed;
      left: calc(env(safe-area-inset-left, 0px) + 10px);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 6;
    }

    .action-btn {
      font-family: inherit;
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 2px;
      color: #fff;
      padding: 12px 18px;
      min-width: 130px;
      background: linear-gradient(#4a6ab8, #2d4380);
      border: 3px solid #000;
      box-shadow:
        inset -3px -3px 0 rgba(0, 0, 0, .35),
        inset 3px 3px 0 rgba(255, 255, 255, .25),
        4px 4px 0 rgba(0, 0, 0, .5);
      cursor: pointer;
      -webkit-appearance: none;
      text-shadow: 1px 1px 0 rgba(0, 0, 0, .7);
      touch-action: manipulation;
    }

    .action-btn:active {
      transform: translate(2px, 2px);
      box-shadow:
        inset -2px -2px 0 rgba(0, 0, 0, .35),
        inset 2px 2px 0 rgba(255, 255, 255, .25),
        2px 2px 0 rgba(0, 0, 0, .5);
    }

    .action-btn.fp-on {
      background: linear-gradient(#c47b3a, #7a4a20);
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 4;
      display: none;
    }

    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .8);
    }

    #crosshair::before {
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      transform: translateX(-50%);
    }

    #crosshair::after {
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      transform: translateY(-50%);
    }

    body.fp #crosshair {
      display: block;
    }

    /* ---------- MENU ---------- */
    #menu {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #162138;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      transition: opacity .45s ease;
    }

    #menu.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #menu::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(0, 0, 0, .1) 25%, rgba(0, 0, 0, .85) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, .35) 0%, rgba(0, 0, 0, 0) 35%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, .6) 100%);
      pointer-events: none;
    }

    #menuContent {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 32px;
      animation: menuIn .55s ease both;
    }

    @keyframes menuIn {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #menu h1 {
      font-family: inherit;
      font-weight: 900;
      color: #fff;
      text-shadow:
        4px 4px 0 #000,
        -2px 4px 0 #000,
        4px -2px 0 #000,
        -2px -2px 0 #000,
        8px 8px 0 rgba(0, 0, 0, .55);
      line-height: .95;
      text-align: center;
      letter-spacing: 4px;
    }

    #menu h1 .line1 {
      display: block;
      font-size: clamp(64px, 14vw, 120px);
      color: #ffe07a;
      letter-spacing: 8px;
    }

    #menu h1 .line2 {
      display: block;
      font-size: clamp(20px, 4.5vw, 38px);
      letter-spacing: 6px;
      color: #fff;
      margin-top: 6px;
    }

    #menu .splash {
      position: absolute;
      top: 6px;
      right: -4px;
      color: #ffea4a;
      font-weight: bold;
      font-size: 13px;
      transform: rotate(-18deg);
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
      animation: splashPulse 1.2s ease-in-out infinite;
      white-space: nowrap;
    }

    @keyframes splashPulse {

      0%,
      100% {
        transform: rotate(-18deg) scale(1);
      }

      50% {
        transform: rotate(-18deg) scale(1.08);
      }
    }

    .mc-btn {
      font-family: inherit;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 2px 2px 0 rgba(0, 0, 0, .9);
      padding: 14px 44px;
      border: 3px solid #000;
      min-width: 300px;
      cursor: pointer;
      box-shadow:
        inset -3px -3px 0 rgba(0, 0, 0, .35),
        inset 3px 3px 0 rgba(255, 255, 255, .28),
        5px 5px 0 rgba(0, 0, 0, .6);
      transition: transform .05s, box-shadow .05s, filter .1s;
      -webkit-appearance: none;
      touch-action: manipulation;
    }

    .mc-btn.play {
      background: linear-gradient(#66c466, #3d8b3d);
    }

    .mc-btn.play:hover {
      filter: brightness(1.12);
    }

    .mc-btn.modding {
      background: linear-gradient(#9a9a9a, #5a5a5a);
      cursor: not-allowed;
      opacity: .55;
      font-size: 16px;
      min-width: 300px;
      padding: 11px 44px;
    }

    .mc-btn:active:not(:disabled) {
      transform: translate(3px, 3px);
      box-shadow:
        inset -2px -2px 0 rgba(0, 0, 0, .35),
        inset 2px 2px 0 rgba(255, 255, 255, .28),
        2px 2px 0 rgba(0, 0, 0, .6);
    }

    #menu .footer {
      margin-top: 10px;
      font-size: 10px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, .55);
      text-shadow: 1px 1px 0 rgba(0, 0, 0, .8);
    }

    #menu .mod-note {
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: #ff8b8b;
      letter-spacing: 1px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity .3s;
    }

    #menu .mod-note.show {
      opacity: 1;
    }

    #menu .tex-status {
      position: absolute;
      bottom: -56px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: rgba(255, 255, 255, .5);
      letter-spacing: 1px;
      white-space: nowrap;
      text-shadow: 1px 1px 0 rgba(0, 0, 0, .9);
    }

    #menu .tex-status .ok {
      color: #7cffa0;
    }

    #menu .tex-status .miss {
      color: #ffb84d;
    }

    /* ---------- BOOT ---------- */
    #boot {
      position: fixed;
      inset: 0;
      background: #0a0f1c;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 14px;
      letter-spacing: 2px;
      text-align: center;
      padding: 24px;
      transition: opacity .4s ease;
    }

    #boot.hide {
      opacity: 0;
      pointer-events: none;
    }

    #boot .bar {
      width: 280px;
      height: 6px;
      background: #1a2236;
      border: 2px solid #2b3a5a;
    }

    #boot .bar i {
      display: block;
      height: 100%;
      width: 0%;
      background: #6fa8ff;
      transition: width .3s ease;
    }

    #boot small {
      opacity: .5;
      font-size: 10px;
      letter-spacing: 1px;
    }

    #boot .err {
      color: #ff8b8b;
      font-size: 11px;
      max-width: 340px;
      line-height: 1.6;
      text-align: left;
      word-break: break-word;
      font-family: monospace;
    }

    #boot .tex-list {
      font-size: 10px;
      line-height: 1.5;
      color: rgba(255, 255, 255, .55);
      text-align: left;
      max-width: 300px;
      width: 100%;
      font-family: monospace;
      max-height: 150px;
      overflow: hidden;
      margin-top: 6px;
    }

    #boot .tex-list .ok {
      color: #7cffa0;
    }

    #boot .tex-list .miss {
      color: #ffb84d;
    }

    #toast {
      position: fixed;
      left: 50%;
      top: 22%;
      transform: translateX(-50%);
      font-size: 16px;
      background: rgba(0, 0, 0, .78);
      padding: 12px 22px;
      border-radius: 10px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .3s, transform .3s;
      color: #ffe07a;
      letter-spacing: 2px;
      font-weight: bold;
      z-index: 50;
      border: 2px solid rgba(255, 224, 122, .4);
      box-shadow: 0 6px 20px rgba(0, 0, 0, .6);
      transform: translate(-50%, -6px);
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>
</head>

<body>

  <div id="game"></div>

  <div id="crosshair" class="hud-el"></div>

  <div id="hud" class="hud-el">
    <div><span class="k">MODE</span> <span class="v mode" id="hudMode">--</span></div>
    <div><span class="k">POS </span> <span class="v" id="hudPos">0, 0</span></div>
    <div><span class="k">ALT </span> <span class="v" id="hudAlt">0</span></div>
    <div><span class="k">TIME</span> <span class="v" id="hudTime">12:00</span></div>
    <div><span class="k">FPS </span> <span class="v" id="hudFps">--</span></div>
  </div>

  <div id="inv" class="hud-el">
    <span class="inv-item"><span class="inv-icon coin"></span><span class="v" id="invCoins">0</span></span>
    <span class="inv-item"><span class="inv-icon potion"></span><span class="v" id="invPotions">0</span></span>
    <span class="inv-item"><span class="inv-icon gem"></span><span class="v" id="invGems">0</span></span>
    <span class="inv-item"><span class="inv-icon chest"></span><span class="v" id="invChests">0</span></span>
  </div>

  <canvas id="minimap" class="hud-el" width="130" height="130"></canvas>

  <div id="actionRow" class="hud-el">
    <button id="fpToggle" class="action-btn">VIEW: 3RD</button>
  </div>

  <div id="stick">
    <div id="knob"></div>
  </div>
  <div id="hint" class="hud-el">LEFT = MOVE · RIGHT = LOOK · PINCH = ZOOM · F = 1ST PERSON</div>

  <div id="menu" class="hidden">
    <div id="menuContent">
      <h1>
        <span class="line1">GUY</span>
        <span class="line2">THE FOLK VALLEY</span>
      </h1>
      <span class="splash">now with crystals!</span>
      <button id="playBtn" class="mc-btn play">PLAY</button>
      <button id="modBtn" class="mc-btn modding" disabled>MODDING</button>
      <p class="footer">a small voxel adventure</p>
      <span class="mod-note" id="modNote">Modding coming soon</span>
      <span class="tex-status" id="texStatus"></span>
    </div>
  </div>

  <div id="boot">
    <div id="bootMsg">LOADING…</div>
    <div class="bar"><i id="bootBar"></i></div>
    <small>GUY THE FOLK VALLEY</small>
    <div class="tex-list" id="bootTexList"></div>
    <div class="err" id="bootErr"></div>
  </div>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script>
    if (typeof THREE === 'undefined') {
  document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js"><\/script>');
}
  </script>
  <script>
    if (typeof THREE === 'undefined') {
  document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
}
  </script>

  <!-- World systems, in load order: terrain → graphics → models -->
  <script src="terrain.js"></script>
  <script src="graphics.js"></script>
  <script src="models.js"></script>

  <script>
    (function () {
'use strict';

var GTF = window.GTF = window.GTF || {};

/* ============================================================ UI */
var $ = function(id){ return document.getElementById(id); };
var bootEl=$('boot'), bootMsg=$('bootMsg'), bootBar=$('bootBar'), bootErr=$('bootErr'), bootTexList=$('bootTexList');
var menuEl=$('menu'), playBtn=$('playBtn'), modBtn=$('modBtn'), modNote=$('modNote'), texStatusEl=$('texStatus');
var hudMode=$('hudMode'), hudPos=$('hudPos'), hudAlt=$('hudAlt'), hudFps=$('hudFps');
var stickEl=$('stick'), knobEl=$('knob'), hintEl=$('hint'), toastEl=$('toast');
var fpToggleBtn=$('fpToggle');
var invCoins=$('invCoins'), invPotions=$('invPotions'),
    invGems=$('invGems'), invChests=$('invChests');

function setBoot(p, m){ if(bootBar) bootBar.style.width=p+'%'; if(m&&bootMsg) bootMsg.textContent=m; }
function failBoot(msg){
  bootEl.style.background='#1a0a0a';
  bootMsg.textContent='ERROR';
  bootErr.textContent=msg;
}
function toast(msg, ms){
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t=setTimeout(function(){ toastEl.classList.remove('show'); }, ms||1400);
}
window.addEventListener('error', function(e){ console.error('[uncaught]', e.error||e.message); });

var inIframe=false;
try{ inIframe=window.self!==window.top; }catch(e){ inIframe=true; }
console.log('[env] iframe='+inIframe+' dpr='+(window.devicePixelRatio||1));

/* ============================================================ CONFIG (gameplay) */
var MOVE_ACCEL    = 30;
var MOVE_FRICTION = 22;
var MOVE_MAX      = 7.0;
var MAX_STEP      = 2.4;

var CAM_DIST_MIN = 4;
var CAM_DIST_MAX = 22;
var CAM_DIST_DEF = 12;
var CAM_LOOK_K   = 1.4;

var PITCH_MIN_TP = -1.25;
var PITCH_MAX_TP =  0.55;
var PITCH_MIN_FP = -1.45;
var PITCH_MAX_FP =  1.45;
var FP_EYE_HEIGHT = 1.55;

var TEX_PATHS = [
  'assets/bg.png',
  'assets/grass.png',
  'assets/water.png',
  'assets/tree_bark.png',
  'assets/tree_leaves.png',
  'assets/player.png',
  'assets/coin.png',
  'assets/potion.png',
  'assets/gem.png',
  'assets/chest.png'
];

/* ============================================================ SHARED ALIASES */
var clamp      = GTF.clamp;
var lerp       = GTF.lerp;
var heightAt   = GTF.heightAt;
var CHUNK      = GTF.CHUNK;
var SEA_LEVEL  = GTF.SEA_LEVEL;

/* ============================================================ SHARED STATE */
var player = GTF.player = {
  x:0.5, z:0.5, y:0, vx:0, vz:0,
  bob:0, moving:false, facing:1, stepTimer:0, inWater:false
};
var inventory = GTF.inventory = { coin:0, potion:0, gem:0, chest:0 };
var cam = GTF.cam = {
  yaw: Math.PI * 0.25,
  pitch: -0.35,
  dist: CAM_DIST_DEF,
  fp: false
};

/* ============================================================ AUDIO */
var audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  catch(e) { audioCtx = null; }
}
function beep(freq, dur, type, vol) {
  if (!audioCtx) return;
  try {
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.value = vol || 0.06;
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function sfxPickup(){
  beep(880, 0.08, 'sine', 0.05);
  setTimeout(function(){ beep(1320, 0.12, 'sine', 0.05); }, 60);
}
function sfxStep(){ beep(150 + Math.random()*60, 0.04, 'triangle', 0.018); }

/* ============================================================ PLAYER */
function findSpawnPoint() {
  for (var ring = 0; ring < 60; ring++) {
    var radius = ring * 3;
    var samples = Math.max(8, ring * 6);
    for (var s = 0; s < samples; s++) {
      var ang = (s / samples) * Math.PI * 2 + ring * 0.37;
      var x = Math.cos(ang) * radius;
      var z = Math.sin(ang) * radius;
      var h = heightAt(x, z);
      if (h > 3 && h < 10) return { x: x, z: z, y: h };
    }
  }
  return { x: 0.5, z: 0.5, y: Math.max(heightAt(0.5, 0.5), 4) };
}
/* Walkable now allows shallow water — depth <= 1.2 units below sea level */
function walkable(x, z) {
  var h = heightAt(x, z);
  if (h < SEA_LEVEL - 1.2) return false;
  var curH = heightAt(player.x, player.z);
  if (Math.abs(h - curH) > MAX_STEP) return false;
  return true;
}
function updatePlayer(dt) {
  var ix = inputVec.x, iy = inputVec.y;
  if (keys['a'] || keys['arrowleft'])  ix -= 1;
  if (keys['d'] || keys['arrowright']) ix += 1;
  if (keys['w'] || keys['arrowup'])    iy -= 1;
  if (keys['s'] || keys['arrowdown'])  iy += 1;
  var mag = Math.sqrt(ix*ix + iy*iy);
  if (mag > 1) { ix /= mag; iy /= mag; mag = 1; }

  var fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw);
  var rx = -fz, rz = fx;
  var fwd = -iy;
  var dirX = fx * fwd + rx * ix, dirZ = fz * fwd + rz * ix;
  var dLen = Math.sqrt(dirX*dirX + dirZ*dirZ);
  var wantMoving = dLen > 0.01;

  var tvx = 0, tvz = 0;
  if (wantMoving) {
    dirX /= dLen; dirZ /= dLen;
    tvx = dirX * MOVE_MAX * mag;
    tvz = dirZ * MOVE_MAX * mag;
  }
  var accel = wantMoving ? MOVE_ACCEL : MOVE_FRICTION;
  player.vx += (tvx - player.vx) * clamp(accel * dt / MOVE_MAX, 0, 1);
  player.vz += (tvz - player.vz) * clamp(accel * dt / MOVE_MAX, 0, 1);

  var spd = Math.sqrt(player.vx*player.vx + player.vz*player.vz);
  if (spd < 0.02) { player.vx = 0; player.vz = 0; spd = 0; }

  if (spd > 0) {
    var steps = 3;
    var stepX = (player.vx * dt) / steps;
    var stepZ = (player.vz * dt) / steps;
    for (var i = 0; i < steps; i++) {
      if (walkable(player.x + stepX, player.z)) player.x += stepX; else player.vx = 0;
      if (walkable(player.x, player.z + stepZ)) player.z += stepZ; else player.vz = 0;
    }
    player.stepTimer -= dt;
    if (player.stepTimer <= 0 && spd > 2) {
      player.stepTimer = 0.28;
      sfxStep();
      var col = GTF.groundColorAt(player.x, player.z);
      GTF.spawnParticles(player.x, player.y + 0.15, player.z, 3, col);
    }
  }

  if (Math.abs(player.vx) > 0.3) player.facing = player.vx > 0 ? 1 : -1;
  var targetY = heightAt(player.x, player.z);
  if (targetY < SEA_LEVEL - 0.3) targetY = SEA_LEVEL - 0.3;
  player.y = lerp(player.y, targetY, 1 - Math.pow(0.0005, dt));

  player.moving = spd > 0.4;
  player.bob += dt * (player.moving ? 11 : 0);
  player.inWater = targetY < SEA_LEVEL + 0.1;
}

/* ============================================================ CAMERA */
function clampPitch() {
  var lo = cam.fp ? PITCH_MIN_FP : PITCH_MIN_TP;
  var hi = cam.fp ? PITCH_MAX_FP : PITCH_MAX_TP;
  cam.pitch = clamp(cam.pitch, lo, hi);
}
function updateCamera(dt, immediate) {
  var camera = GTF.camera;
  if (!camera) return;
  var cp = Math.cos(cam.pitch);
  var sp = Math.sin(cam.pitch);
  var lookDirX = -Math.sin(cam.yaw) * cp;
  var lookDirY = sp;
  var lookDirZ = -Math.cos(cam.yaw) * cp;

  if (cam.fp) {
    var eyeY = player.y + FP_EYE_HEIGHT;
    if (immediate) camera.position.set(player.x, eyeY, player.z);
    else {
      var k = 1 - Math.pow(0.001, dt);
      camera.position.x = lerp(camera.position.x, player.x, k);
      camera.position.y = lerp(camera.position.y, eyeY, k);
      camera.position.z = lerp(camera.position.z, player.z, k);
    }
    camera.lookAt(
      player.x + lookDirX * 12,
      eyeY + lookDirY * 12,
      player.z + lookDirZ * 12
    );
  } else {
    var eyeY2 = player.y + CAM_LOOK_K;
    var camTX = player.x - lookDirX * cam.dist;
    var camTY = eyeY2 - lookDirY * cam.dist;
    var camTZ = player.z - lookDirZ * cam.dist;
    var groundY = heightAt(camTX, camTZ) + 1.2;
    if (camTY < groundY) camTY = groundY;
    if (camTY < SEA_LEVEL + 1.5) camTY = SEA_LEVEL + 1.5;
    if (immediate) camera.position.set(camTX, camTY, camTZ);
    else {
      var k2 = 1 - Math.pow(0.003, dt);
      camera.position.x = lerp(camera.position.x, camTX, k2);
      camera.position.y = lerp(camera.position.y, camTY, k2);
      camera.position.z = lerp(camera.position.z, camTZ, k2);
    }
    camera.lookAt(
      player.x + lookDirX * 4,
      eyeY2 + lookDirY * 4,
      player.z + lookDirZ * 4
    );
  }
}
function setFpMode(on) {
  cam.fp = !!on;
  if (cam.fp) document.body.classList.add('fp');
  else document.body.classList.remove('fp');
  fpToggleBtn.textContent = cam.fp ? 'VIEW: 1ST' : 'VIEW: 3RD';
  if (cam.fp) fpToggleBtn.classList.add('fp-on');
  else fpToggleBtn.classList.remove('fp-on');
  clampPitch();
  if (GTF.playerSprite) GTF.playerSprite.visible = !cam.fp;
  console.log('[camera] ' + (cam.fp ? 'first' : 'third') + ' person');
}

/* ============================================================ INPUT */
var keys = {};
var inputVec = { x:0, y:0 };
var movePointer = null, lookPointer = null;
var stickCenter = { x:0, y:0 };
var lookLastX = 0, lookLastY = 0;
var STICK_R = 52;
var pinch = [];

document.addEventListener('pointerdown', function(e){
  initAudio();
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (pinch.length < 2) pinch.push({ id: e.pointerId, x: e.clientX, y: e.clientY });
  if (e.clientX < window.innerWidth * 0.5 && movePointer === null && pinch.length < 2) {
    movePointer = e.pointerId;
    stickCenter.x = e.clientX; stickCenter.y = e.clientY;
    stickEl.style.left = e.clientX + 'px';
    stickEl.style.top  = e.clientY + 'px';
    stickEl.style.display = 'block';
    knobEl.style.left = '60px'; knobEl.style.top = '60px';
    hideHint();
  } else if (lookPointer === null && pinch.length < 2) {
    lookPointer = e.pointerId;
    lookLastX = e.clientX;
    lookLastY = e.clientY;
    hideHint();
  }
}, { passive:false });

document.addEventListener('pointermove', function(e){
  for (var i = 0; i < pinch.length; i++) {
    if (pinch[i].id === e.pointerId) { pinch[i].x = e.clientX; pinch[i].y = e.clientY; }
  }
  if (pinch.length === 2) {
    var d = Math.hypot(pinch[0].x - pinch[1].x, pinch[0].y - pinch[1].y);
    if (window.__pinchStart === undefined) {
      window.__pinchStart = d;
      window.__pinchCamStart = cam.dist;
    }
    cam.dist = clamp(window.__pinchCamStart * (window.__pinchStart / d), CAM_DIST_MIN, CAM_DIST_MAX);
  }
  if (e.pointerId === movePointer) {
    var dx = e.clientX - stickCenter.x;
    var dy = e.clientY - stickCenter.y;
    var len = Math.sqrt(dx*dx + dy*dy);
    var clamped = Math.min(len, STICK_R);
    var nx = len > 0.001 ? dx/len : 0;
    var ny = len > 0.001 ? dy/len : 0;
    knobEl.style.left = (60 + nx*clamped) + 'px';
    knobEl.style.top  = (60 + ny*clamped) + 'px';
    var s = clamped / STICK_R;
    inputVec.x = nx * s; inputVec.y = ny * s;
  } else if (e.pointerId === lookPointer) {
    var ddx = e.clientX - lookLastX;
    var ddy = e.clientY - lookLastY;
    lookLastX = e.clientX;
    lookLastY = e.clientY;
    cam.yaw -= ddx * 0.006;
    cam.pitch -= ddy * 0.006;
    clampPitch();
  }
}, { passive:false });

function endPointer(e){
  for (var i = 0; i < pinch.length; i++) {
    if (pinch[i].id === e.pointerId) { pinch.splice(i,1); break; }
  }
  if (pinch.length < 2) window.__pinchStart = undefined;
  if (e.pointerId === movePointer) {
    movePointer = null; inputVec.x = 0; inputVec.y = 0;
    stickEl.style.display = 'none';
  } else if (e.pointerId === lookPointer) {
    lookPointer = null;
  }
}
document.addEventListener('pointerup', endPointer, { passive:false });
document.addEventListener('pointercancel', endPointer, { passive:false });
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
window.addEventListener('keydown', function(e){
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'f' || e.key === 'F') setFpMode(!cam.fp);
});
window.addEventListener('keyup', function(e){ keys[e.key.toLowerCase()] = false; });
fpToggleBtn.addEventListener('click', function(){ setFpMode(!cam.fp); });

var hintHidden = false;
function hideHint(){ if (!hintHidden) { hintHidden = true; hintEl.style.opacity = '0'; } }

/* ============================================================ HUD */
function updateHud() {
  hudPos.textContent = Math.floor(player.x) + ',' + Math.floor(player.z);
  hudAlt.textContent = player.y.toFixed(1);
  invCoins.textContent = inventory.coin;
  invPotions.textContent = inventory.potion;
  invGems.textContent = inventory.gem;
  invChests.textContent = inventory.chest;
}

/* ============================================================ LOOP */
var contextLost = false;
var lastTime = performance.now();
var fpsAccum = 0, fpsFrames = 0;

function loop(now) {
  requestAnimationFrame(loop);
  var dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  if (contextLost) return;

  updatePlayer(dt);
  updateCamera(dt, false);
  GTF.updateChunks(false);
  GTF.processChunkQueue(8);

  if (GTF.waterPlane) {
    var snapX = Math.round(player.x / 60) * 60;
    var snapZ = Math.round(player.z / 60) * 60;
    GTF.waterPlane.position.set(snapX, SEA_LEVEL, snapZ);
    if (GTF.waterMaterial.map) {
      GTF.waterMaterial.map.offset.x = (now * 0.00004) % 1;
      GTF.waterMaterial.map.offset.y = (now * 0.00003) % 1;
    }
  }

  GTF.updateDayNight(dt);
  GTF.updateClouds(dt);
  GTF.updateBirds(dt, now / 1000);
  GTF.updateParticles(dt);

  if (GTF.playerSprite && !cam.fp) {
    var bobY = player.moving ? Math.abs(Math.sin(player.bob)) * 0.10 : 0;
    GTF.playerSprite.position.set(player.x, player.y + bobY, player.z);
    var bsx = GTF.playerSprite.userData.baseScaleX || 1.2;
    var bsy = GTF.playerSprite.userData.baseScaleY || 1.8;
    GTF.playerSprite.scale.set(bsx * player.facing, bsy, 1);
  }

  var time = now / 1000;
  GTF.chunks.forEach(function(chunk){
    for (var i = 0; i < chunk.items.length; i++) {
      var it = chunk.items[i];
      if (it.userData.dead) continue;
      it.position.y = it.userData.baseY + Math.sin(time * 2.4 + it.userData.phase) * 0.18;
      var dx = it.position.x - player.x;
      var dz = it.position.z - player.z;
      if (dx*dx + dz*dz < 1.8) {
        var typ = it.userData.typ;
        inventory[typ] = (inventory[typ]||0) + 1;
        GTF.collectedItems.add(it.userData.key);
        it.userData.dead = true;
        chunk.group.remove(it);
        if (it.material) it.material.dispose();
        var col = typ === 'coin' ? 0xffe090 :
                  typ === 'potion' ? 0xff8080 :
                  typ === 'gem' ? 0x80f0ff : 0xffd060;
        GTF.spawnParticles(it.position.x, it.position.y, it.position.z, 12, col);
        sfxPickup();
        if (typ === 'chest') toast('Chest collected!', 1200);
        else if (typ === 'gem') toast('Gem!', 900);
        updateHud();
      }
    }
  });

  GTF.renderer.render(GTF.scene, GTF.camera);

  fpsAccum += dt; fpsFrames++;
  if (fpsAccum >= 0.5) {
    hudFps.textContent = Math.round(fpsFrames / fpsAccum);
    fpsAccum = 0; fpsFrames = 0;
    updateHud();
  }
  if ((fpsFrames & 7) === 0) GTF.drawMinimap();
}

window.addEventListener('resize', function(){
  var renderer = GTF.renderer, camera = GTF.camera;
  if (renderer && camera) {
    var pr = Math.min(window.devicePixelRatio||1, inIframe ? 1 : 1.5);
    renderer.setPixelRatio(pr);
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  }
});

/* ============================================================ MENU HANDLERS */
modBtn.addEventListener('click', function(e){
  e.preventDefault();
  modNote.classList.add('show');
  setTimeout(function(){ modNote.classList.remove('show'); }, 1600);
});
playBtn.addEventListener('click', function(){
  initAudio();
  menuEl.classList.add('hidden');
  document.body.classList.add('playing');
  setTimeout(function(){
    if (menuEl.parentNode) menuEl.parentNode.removeChild(menuEl);
  }, 500);
  lastTime = performance.now();
  requestAnimationFrame(loop);
  setFpMode(false);
});

/* ============================================================ BOOT */
function boot() {
  if (typeof THREE === 'undefined') {
    failBoot('three.js did not load from any CDN. Check internet and reload.');
    return;
  }
  setBoot(5, 'CHECKING TEXTURES…');

  GTF.probeAllTextures(TEX_PATHS).then(function(texMap){
    var found = 0;
    var statusHtml = '';
    console.log('[textures] probing ' + TEX_PATHS.length + ' files:');
    TEX_PATHS.forEach(function(p){
      var r = texMap[p];
      if (r.ok) {
        found++;
        console.log('  ✓ ' + p + '  ' + r.w + 'x' + r.h);
        statusHtml += '<div><span class="ok">✓</span> ' + p.replace('assets/', '') + '  ' + r.w + 'x' + r.h + '</div>';
      } else {
        console.warn('  ✗ ' + p + '  (' + (r.reason || 'missing') + ')');
        statusHtml += '<div><span class="miss">✗</span> ' + p.replace('assets/', '') + '  (' + (r.reason || 'missing') + ')</div>';
      }
    });
    bootTexList.innerHTML = statusHtml;
    var missCount = TEX_PATHS.length - found;
    console.log('[textures] ' + found + '/' + TEX_PATHS.length + ' found');
    texStatusEl.innerHTML = '<span class="ok">' + found + ' ok</span>' +
      (missCount > 0 ? ' · <span class="miss">' + missCount + ' fallback</span>' : '');

    setBoot(20, 'CREATING RENDERER…');
    setTimeout(function(){
      var renderer = GTF.createRenderer();
      if (!renderer) {
        failBoot(
          'Could not create a WebGL context.\n\n' +
          'If you are inside an iframe or online editor (URL shows about:srcdoc), ' +
          'WebGL is usually blocked. Save as index.html and serve over HTTP.'
        );
        return;
      }
      GTF.renderer = renderer;
      document.getElementById('game').appendChild(renderer.domElement);

      setBoot(35, 'BUILDING SCENE…');
      setTimeout(function(){
        try {
          var scene = GTF.setupScene();
          var camera = GTF.camera;

          GTF.applyTextures(texMap);

          if (texMap['assets/bg.png'] && texMap['assets/bg.png'].ok) {
            menuEl.style.backgroundImage = "url('assets/bg.png')";
            console.log('[menu] bg.png applied');
          } else {
            menuEl.style.backgroundImage =
              'linear-gradient(180deg, #4a8fd7 0%, #7fb8e8 35%, #6fae58 65%, #3d6b2c 100%)';
            console.log('[menu] using gradient fallback');
          }

          setBoot(55, 'FINDING SPAWN…');
          var spawn = findSpawnPoint();
          player.x = spawn.x; player.z = spawn.z; player.y = spawn.y;
          console.log('[spawn] ' + spawn.x.toFixed(1) + ',' + spawn.z.toFixed(1) + ' y=' + spawn.y.toFixed(2));
          GTF.playerSprite.position.set(player.x, player.y, player.z);
          updateCamera(0, true);

          renderer.domElement.addEventListener('webglcontextlost', function(e){
            e.preventDefault();
            contextLost = true;
            hudMode.textContent = 'LOST'; hudMode.style.color = '#ff8b8b';
          }, false);
          renderer.domElement.addEventListener('webglcontextrestored', function(){
            contextLost = false;
            hudMode.textContent = 'WEBGL 3D'; hudMode.style.color = '#7cffa0';
          }, false);

          setBoot(75, 'GENERATING CHUNKS…');
          setTimeout(function(){
            GTF.updateChunks(true);
            for (var i = 0; i < 20 && GTF.chunkQueue.length > 0; i++) {
              var job = GTF.chunkQueue.shift();
              if (GTF.chunks.has(job.key)) continue;
              GTF.chunks.set(job.key, GTF.buildChunk(job.cx, job.cz));
            }
            renderer.render(scene, camera);

            hudMode.textContent = 'WEBGL 3D';
            hudMode.style.color = '#7cffa0';
            updateHud();
            GTF.drawMinimap();
            setBoot(100, 'READY');
            console.log('[boot] ready. THREE r' + THREE.REVISION);

            setTimeout(function(){
              bootEl.classList.add('hide');
              setTimeout(function(){
                if (bootEl.parentNode) bootEl.parentNode.removeChild(bootEl);
                menuEl.classList.remove('hidden');
              }, 400);
            }, 250);
          }, 30);
        } catch (e) {
          console.error(e);
          failBoot('Scene error: ' + (e.message || String(e)));
        }
      }, 30);
    }, 30);
  });
}

if (document.readyState === 'complete' || document.readyState === 'interactive') {
  setTimeout(boot, 20);
} else {
  window.addEventListener('DOMContentLoaded', function(){ setTimeout(boot, 20); });
}

})();
  </script>
